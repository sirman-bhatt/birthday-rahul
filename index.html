<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday Rahul ❤️</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family: 'Poppins', sans-serif;
}

body{
background: linear-gradient(135deg,#ffdde1,#ee9ca7);
overflow-x:hidden;
text-align:center;
color:white;
}

.container{
padding:30px;
}

h1{
font-size:42px;
margin-top:20px;
animation: glow 2s infinite alternate;
}

@keyframes glow{
from{ text-shadow:0 0 10px white; }
to{ text-shadow:0 0 20px red; }
}

.subtitle{
margin-top:10px;
font-size:18px;
}

.gifts{
display:flex;
justify-content:center;
gap:25px;
flex-wrap:wrap;
margin-top:50px;
}

.gift{
width:220px;
height:220px;
background:white;
border-radius:25px;
display:flex;
align-items:center;
justify-content:center;
font-size:80px;
cursor:pointer;
transition:0.4s;
box-shadow:0 10px 25px rgba(0,0,0,0.2);
}

.gift:hover{
transform:scale(1.08);
}

.popup{
position:fixed;
top:50%;
left:50%;
transform:translate(-50%,-50%);
width:90%;
max-width:700px;
background:white;
padding:20px;
border-radius:20px;
display:none;
z-index:1000;
color:black;
box-shadow:0 0 30px rgba(0,0,0,0.4);
animation: pop 0.5s ease;
}

@keyframes pop{
from{
transform:translate(-50%,-50%) scale(0.5);
opacity:0;
}
to{
transform:translate(-50%,-50%) scale(1);
opacity:1;
}
}

.popup img,
.popup video{
width:100%;
border-radius:15px;
margin-top:15px;
}

.close{
margin-top:15px;
padding:10px 20px;
border:none;
background:#ff4d6d;
color:white;
border-radius:10px;
cursor:pointer;
font-size:16px;
}

.hearts{
position:fixed;
width:100%;
height:100%;
pointer-events:none;
overflow:hidden;
top:0;
left:0;
}

.heart{
position:absolute;
color:red;
font-size:20px;
animation: float 6s linear infinite;
}

@keyframes float{
0%{
transform:translateY(100vh) scale(0);
opacity:0;
}
50%{
opacity:1;
}
100%{
transform:translateY(-10vh) scale(1.5);
opacity:0;
}
}

.password-screen{
position:fixed;
width:100%;
height:100%;
background:#ffb6c1;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
z-index:2000;
}

.password-screen input{
padding:12px;
border:none;
border-radius:10px;
margin-top:15px;
width:250px;
text-align:center;
font-size:16px;
}

.password-screen button{
margin-top:15px;
padding:10px 20px;
border:none;
background:#ff4d6d;
color:white;
border-radius:10px;
font-size:16px;
cursor:pointer;
}
</style>
</head>

<body>

<div class="password-screen" id="lockScreen">
<h1>🎂 Rahul's Birthday Surprise ❤️</h1>
<p>Enter Password</p>
<input type="password" id="password" placeholder="Enter password">
<button onclick="unlock()">Open Surprise</button>
</div>

<div class="hearts"></div>

<div class="container">

<h1>Happy Birthday Rahul ❤️</h1>
<p class="subtitle">A small surprise made with lots of love 💖</p>

<div class="gifts">

<div class="gift" onclick="openGift('gift1')">
🎁
</div>

<div class="gift" onclick="openGift('gift2')">
🖼️
</div>

<div class="gift" onclick="openGift('gift3')">
🎥
</div>

</div>
</div>

<!-- Gift 1 -->
<div class="popup" id="gift1">
<h2>💌 Love Letter</h2>

<p style="margin-top:20px;font-size:20px;line-height:35px;">
Happy Birthday my jaan ❤️ <br><br>
I wish all your dreams come true and be happy always... <br><br>
Love you 😘
</p>

<button class="close" onclick="closeGift('gift1')">Close</button>
</div>

<!-- Gift 2 -->
<div class="popup" id="gift2">
<h2>📸 Our Memories</h2>

<img src="photo1.jpg">
<img src="photo2.jpg">

<audio controls autoplay loop style="margin-top:15px;width:100%;">
<source src="music.mp3" type="audio/mpeg">
</audio>

<button class="close" onclick="closeGift('gift2')">Close</button>
</div>

<!-- Gift 3 -->
<div class="popup" id="gift3">
<h2>🎥 Couple Video</h2>

<video controls autoplay>
<source src="video.mp4" type="video/mp4">
</video>

<button class="close" onclick="closeGift('gift3')">Close</button>
</div>

<script>

function openGift(id){
document.getElementById(id).style.display="block";
}

function closeGift(id){
document.getElementById(id).style.display="none";
}

function unlock(){
let pass=document.getElementById("password").value;

if(pass==="rahul"){
document.getElementById("lockScreen").style.display="none";
}else{
alert("Wrong Password ❤️");
}
}

function createHeart(){
const heart=document.createElement("div");
heart.classList.add("heart");
heart.innerHTML="❤️";

heart.style.left=Math.random()*100+"vw";
heart.style.fontSize=Math.random()*20+15+"px";

document.querySelector(".hearts").appendChild(heart);

setTimeout(()=>{
heart.remove();
},6000);
}

setInterval(createHeart,300);

</script>

</body>
</html>
